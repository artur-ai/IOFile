name: Java CI

on:
  push:
    branches:
      - ci-setup
  pull_request:
    branches:
      - ci-setup

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'

      - name: Compile Java files
        run: javac com/maiboroda/*.java

      - name: Run Main class with test arguments
        run: java com.maiboroda.StartForUser sample.txt testword
